[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to vsmov.com to bypass CORS in production.
[[redirects]]
  from = "/api/*"
  to = "https://phimapi.com/:splat"
  status = 200
  force = true

# SPA fallback — send every non-file route to index.html so React Router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
